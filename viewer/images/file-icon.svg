<?xml version="1.0" encoding="UTF-8"?>
<!--
  .rhv file-type icon used by the PWA file_handlers manifest entry.
  Shows a document (folded corner) with the GSWeb dot mark and an
  ".rhv" label so explorer-style thumbnails read at a glance.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="512" height="512">
  <!-- Document page -->
  <path
    fill="#ffffff"
    stroke="#1f2937"
    stroke-width="1.5"
    stroke-linejoin="round"
    d="M10,4 h22 l8,8 v32 a2,2 0 0 1 -2,2 h-28 a2,2 0 0 1 -2,-2 v-38 a2,2 0 0 1 2,-2 z" />

  <!-- Folded corner -->
  <path
    fill="#e5e7eb"
    stroke="#1f2937"
    stroke-width="1.5"
    stroke-linejoin="round"
    d="M32,4 v8 h8 z" />

  <!-- GSWeb dot mark -->
  <g fill="#c4201f">
    <ellipse cx="24" cy="25" rx="4.6" ry="3.4" transform="rotate(25 24 25)" />
    <ellipse cx="31.5" cy="26.5" rx="2.8" ry="2" transform="rotate(25 31.5 26.5)" />
    <ellipse cx="16.5" cy="22.5" rx="2.6" ry="1.9" transform="rotate(25 16.5 22.5)" />
    <ellipse cx="25" cy="18" rx="2.6" ry="1.9" transform="rotate(25 25 18)" />
    <ellipse cx="19" cy="31" rx="1.8" ry="1.3" transform="rotate(25 19 31)" />
  </g>

  <!-- ".rhv" label -->
  <text x="24" y="42" font-family="system-ui, -apple-system, sans-serif"
        font-size="6" font-weight="700" text-anchor="middle" fill="#1f2937">.rhv</text>
</svg>
